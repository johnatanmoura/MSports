<head>
<meta charset="UTF-8">

<title>Pague com Pix</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #ffffff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    max-width: 360px;
    width: 100%;
    text-align: center;
  }
  .logo {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    object-fit: cover;
    margin: 0 auto 20px;
    display: block;
  }
  h1 {
    font-size: 18px;
    font-weight: 600;
    color: #111;
    margin-bottom: 2px;
  }
  .nome {
    font-size: 13px;
    color: #999;
    margin-bottom: 28px;
    letter-spacing: 0.02em;
  }
  .chave-box {
    border: 1px solid #eaeaea;
    border-radius: 8px;
    padding: 14px 16px;
    font-size: 15px;
    color: #333;
    margin-bottom: 20px;
    word-break: break-all;
    font-family: ui-monospace, monospace;
  }
  .links {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  button, a.link {
    width: 100%;
    padding: 13px;
    border: 1px solid #111;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    background: transparent;
    color: #111;
    text-decoration: none;
    display: block;
    transition: background 0.15s, color 0.15s;
  }
  .btn-copiar {
    background: #111;
    color: #fff;
  }
  .btn-copiar.copiado {
    background: #444;
  }
  a.link:hover, button:hover {
    opacity: 0.75;
  }
  .link.oculto { display: none; }
  .aviso {
    font-size: 12px;
    color: #aaa;
    margin-top: 20px;
  }
</style>
</head>

  btnInsta.classList.add('oculto');
}

function copiarChave() {
  navigator.clipboard.writeText(CHAVE_PIX).then(() => {
    const btn = document.getElementById('btnCopiar');
    btn.textContent = "Chave copiada!";
    btn.classList.add('copiado');
    setTimeout(() => {
      btn.textContent = "Copiar chave Pix";
      btn.classList.remove('copiado');
    }, 2000);
  });
}
</script>
